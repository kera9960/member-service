name: Docker CI/CD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build --platform linux/arm64 -t ${{ secrets.DOCKERHUB_USERNAME }}/member-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/member-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/member-app:latest
            sudo docker stop member-app || true
            sudo docker rm member-app || true
            sudo docker run -d \
              --name member-app \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e SPRING_CLOUD_AWS_S3_BUCKET=${{ secrets.S3_BUCKET }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/member-app:latest